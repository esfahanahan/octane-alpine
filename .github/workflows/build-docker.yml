name: Build Docker Images
on:
  schedule:
    # php-alpine republishes the pinned security releases at 02:00 UTC.
    # Rebuild after those tags have moved.
    - cron: "0 4 * * *"
  push:
    branches: [master]
    paths:
      - '.github/**'
      - 'docker/**'
      - 'fs/**'
      - 'docker-bake.hcl'
  pull_request:
    paths:
      - '.github/**'
      - 'docker/**'
      - 'fs/**'
      - 'docker-bake.hcl'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      fail-fast: true
      matrix:
        # One Alpine release. Every entry pushes the short tags, so a second
        # entry would publish 8.5-swoole-mysql twice.
        alpine: ["3.24"]
        php:
          - version: "8.5"
            patch: "8.5.12"
          - version: "8.4"
            patch: "8.4.27"
          - version: "8.3"
            patch: "8.3.36"
          - version: "8.2"
            patch: "8.2.35"
        variant:
          - name: swoole-mysql
            base: mysql
            stack: Swoole, MySQL, and Supervisor
            extensions: bcmath, exif, gd, intl, opcache, pcntl, pdo, pdo_mysql, redis, soap, sockets, swoole, xml, zip
          - name: swoole-mysql-dev
            base: mysql
            stack: Swoole, MySQL, Supervisor, and development tools
            extensions: bcmath, exif, gd, intl, opcache, pcntl, pdo, pdo_mysql, redis, soap, sockets, swoole, xml, zip
          - name: swoole-pgsql
            base: pgsql
            stack: Swoole, PostgreSQL, and Supervisor
            extensions: bcmath, exif, gd, intl, opcache, pcntl, pdo, pdo_pgsql, redis, soap, sockets, swoole, xml, zip
          - name: swoole-pgsql-dev
            base: pgsql
            stack: Swoole, PostgreSQL, Supervisor, and development tools
            extensions: bcmath, exif, gd, intl, opcache, pcntl, pdo, pdo_pgsql, redis, soap, sockets, swoole, xml, zip
    name: ${{ matrix.php.patch }} alpine${{ matrix.alpine }} ${{ matrix.variant.name }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.php.version }}-${{ matrix.variant.name }}
            type=raw,value=${{ matrix.php.patch }}-${{ matrix.variant.name }}
            type=raw,value=${{ matrix.php.version }}-${{ matrix.variant.name }}-alpine${{ matrix.alpine }}
            type=raw,value=${{ matrix.php.patch }}-${{ matrix.variant.name }}-alpine${{ matrix.alpine }}
          labels: |
            org.opencontainers.image.title=PHP ${{ matrix.php.patch }} with ${{ matrix.variant.stack }}
            org.opencontainers.image.description=PHP ${{ matrix.php.patch }} with ${{ matrix.variant.stack }} including extensions: (${{ matrix.variant.extensions }}) based on ghcr.io/esfahanahan/php-alpine:${{ matrix.php.patch }}-${{ matrix.variant.base }}-alpine${{ matrix.alpine }}
            org.opencontainers.image.vendor=Esfahan Ahan Apadana
            org.opencontainers.image.authors=Hossein Hosni <hosni@esfahanahan.com>
            org.opencontainers.image.version=${{ matrix.php.patch }}
            org.opencontainers.image.base.name=ghcr.io/esfahanahan/php-alpine:${{ matrix.php.patch }}-${{ matrix.variant.base }}-alpine${{ matrix.alpine }}
          annotations: |
            org.opencontainers.image.title=PHP ${{ matrix.php.patch }} with ${{ matrix.variant.stack }}
            org.opencontainers.image.description=PHP ${{ matrix.php.patch }} with ${{ matrix.variant.stack }} including extensions: (${{ matrix.variant.extensions }}) based on ghcr.io/esfahanahan/php-alpine:${{ matrix.php.patch }}-${{ matrix.variant.base }}-alpine${{ matrix.alpine }}
            org.opencontainers.image.vendor=Esfahan Ahan Apadana
            org.opencontainers.image.authors=Hossein Hosni <hosni@esfahanahan.com>
            org.opencontainers.image.version=${{ matrix.php.patch }}
            org.opencontainers.image.base.name=ghcr.io/esfahanahan/php-alpine:${{ matrix.php.patch }}-${{ matrix.variant.base }}-alpine${{ matrix.alpine }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build and push
        uses: docker/bake-action@v7
        with:
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
            cwd://${{ steps.meta.outputs.bake-file-annotations }}
          targets: ${{ matrix.variant.name }}
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          provenance: mode=max
          sbom: true
          vars: |
            PHP_VERSION=${{ matrix.php.patch }}
            ALPINE_VERSION=${{ matrix.alpine }}
          set: |
            *.cache-from=type=gha,scope=${{ github.ref_name }}-${{ matrix.php.patch }}-alpine${{ matrix.alpine }}-${{ matrix.variant.name }}
            *.cache-to=type=gha,mode=max,scope=${{ github.ref_name }}-${{ matrix.php.patch }}-alpine${{ matrix.alpine }}-${{ matrix.variant.name }}
