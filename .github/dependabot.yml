version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10

  # Each Dockerfile FROM is tag@digest. The tag is the PHP release.
  # A rebuilt tag updates the digest. 8.5.12 can move to 8.5.13.
  # 8.2.35 does not move to 8.5.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      php-alpine:
        patterns:
          - "esfahanahan/php-alpine"
    ignore:
      - dependency-name: "esfahanahan/php-alpine"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
