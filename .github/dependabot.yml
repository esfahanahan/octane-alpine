version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10

  # Image tags must be literal. docker/pins is the source of those tags.
  # Patch updates stay on the same PHP line: 8.5.12 can move to 8.5.13,
  # and 8.2.35 does not move to 8.5.
  - package-ecosystem: docker
    directory: /docker/pins
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      php-alpine:
        patterns:
          - "esfahanahan/php-alpine"
    ignore:
      - dependency-name: "esfahanahan/php-alpine"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
